'use strict';
// ═══════════════════════════════════════════════════
//  FIGHT PROTOTYPE
//  One hunt against one monster, to test the feel of combat:
//  tap = attack, hold = charge, swipe = dodge, swipe up = potion.
//  Art pipeline is the same as 8-Bit Industry: every sprite is drawn in code
//  into a tiny canvas and scaled up with smoothing off. No image files.
// ═══════════════════════════════════════════════════
const VER='0.6.0';
const W=128; let LH=208;                 // logical size: fixed width, height follows the screen
const cv=document.getElementById('c'), g=cv.getContext('2d');

// ── Tuning ──
const HUNT_TIME=150;                     // soft limit, seconds
const POTIONS=2, POTION_HEAL=.4;       // a potion heals this share of full health
const TAP_DMG=[12,14,22], TAP_DUR=[.26,.26,.4], TAP_HIT=[.09,.09,.16];
const HEAVY_DMG=[0,40,85,150], CHARGE_AT=[.45,1.0,1.7];
const DODGE_DUR=.42, DODGE_IFR=.36, DODGE_COST=25, PERFECT_WIN=.2;
const COUNTER_WIN=1.4, COUNTER_DMG=120, COUNTER_STUN=40;   // a perfect dodge opens a counter
const STUN_GROW=40, STUN_TIME=4, STUN_HEAVY=[0,8,16,30], STUN_TAP=2;   // head hits fill the stun meter
// Weak points: a red circle shrinks on a part; tap it in time. Three hits break the part.
const QTE_GAP=[1.9,2.9], QTE_FIRST=2.5, QTE_DMG=40, QTE_R=15, QTE_STUN=15;
const PARTS=['head','wings','tail'];
const EVADE_DUR=1;

  fire:  {wind:1.3, hits:[0,.5],  after:.35, rec:1.2, dmg:12},
  tri:   {wind:.7,  hits:[0,.45,.9], after:.3, rec:1.3, dmg:9},

// ── Monsters. speed: wind-up multiplier per phase. qteTime: seconds a weak-point circle takes to close.
//    evadeCd: seconds between its dodges per phase. loot.parts: the drop each broken part guarantees.
const MONSTERS={
  fern:{id:'fern',name:'FERNWING',kind:0,biome:0,stars:1,hp:3100,dmg:1,speed:[1,.88,.78],qteTime:.5,evadeCd:[3.4,2.6,1.9],stunMax:100,blood:'#3f9e8a',
    pools:[['bite','bite','bite','tail','tail'],['bite','tail','dbl','dbl','fire','fire'],['tail','dbl','fire','fire','dive','dive']],
    loot:{common:[['scale',2,4],['claw',1,2]],parts:{head:'horn',wings:'wing',tail:'spike'}}},
  ember:{id:'ember',name:'EMBERWING',kind:1,biome:1,stars:3,needs:'fern',hp:5400,dmg:1.5,speed:[.9,.8,.7],qteTime:.38,evadeCd:[3,2.2,1.6],stunMax:130,blood:'#b8402e',
    pools:[['bite','tail','tail','dbl','dbl'],['tail','dbl','tri','tri','fire','fire'],['tri','tri','fire','fire','dive','dive','dbl']],

};

// ── Gear. One weapon, one armor and one charm are worn at a time.
const GEAR={
  iron:   {slot:'weapon',name:'IRON SWORD',   atk:1},
  leather:{slot:'armor', name:'LEATHER ARMOR',hp:100},
  fblade: {slot:'weapon',name:'FERN BLADE',   desc:'ATTACK +30%',       atk:1.3, cost:{scale:6,claw:3,horn:1}},
  fmail:  {slot:'armor', name:'FERN MAIL',    desc:'HEALTH 140',        hp:140,  cost:{scale:8,claw:2,wing:1}},
  keen:   {slot:'charm', name:'KEEN EYE CHARM',desc:'CIRCLES 40% SLOWER',qteSlow:1.4,cost:{horn:1,wing:1,spike:1}},
  eblade: {slot:'weapon',name:'EMBER GREATSWORD',desc:'ATTACK +70%',    atk:1.7, cost:{e_scale:6,e_claw:3,e_horn:2}},

};
const FORGE=['fblade','fmail','keen','eblade','eplate','breaker'];

// ── Helpers ──
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*clamp(t,0,1);
const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
function hash2(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function shade(hex,f){const n=parseInt(hex.slice(1),16),t=f<0?0:255,a=Math.abs(f);const c=v=>Math.round(v+(t-v)*a);return'#'+((1<<24)|(c(n>>16)<<16)|(c(n>>8&255)<<8)|c(n&255)).toString(16).slice(1);}

// ═══════════════════════════════════════════════════
//  PIXEL SPRITES
//  shapeSpr paints colour indices into a grid from simple shapes, then shades each
//  colour area (light from the top left) and outlines the silhouette. Cached by key.
//  A palette entry starting with '!' is drawn flat (eyes, glows).
// ═══════════════════════════════════════════════════
const OUTLINE='#141826';
let SPR={}, SPR_N=0;
function shapeSpr(key,w,h,pal,paint){
  if(SPR[key])return SPR[key];
  if(++SPR_N>600){SPR={};SPR_N=0;}
  const G=new Uint8Array(w*h); let ox=0,oy=0;
  const set=(x,y,c)=>{x=(x+ox)|0;y=(y+oy)|0;if(x>=0&&y>=0&&x<w&&y<h)G[y*w+x]=c;};
  const a={
    off(x,y){ox=x;oy=y;},
    ell(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if((x*x)/(rx*rx+.5)+(y*y)/(ry*ry+.5)<=1)set(cx+x,cy+y,c);},
    rect(x,y,ww,hh,c){for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)set(x+i,y+j,c);},
    poly(pts,c){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
      for(let y=Math.floor(y0);y<=y1;y++)for(let x=Math.floor(x0);x<=x1;x++){let ins=false;
        for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y+.5)!==(yj>y+.5))&&(x+.5<(xj-xi)*(y+.5-yi)/(yj-yi)+xi))ins=!ins;}
        if(ins)set(x,y,c);}},
    px:set
  };
  paint(a);
  const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');
  const at=(x,y)=>x<0||y<0||x>=w||y>=h?0:G[y*w+x];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=at(x,y);
    if(!v){if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){q.fillStyle=OUTLINE;q.fillRect(x,y,1,1);}continue;}
    const p=pal[v]; let col=p;
    if(p[0]==='!')col=p.slice(1);
    else if(at(x-1,y-1)!==v&&at(x,y-1)!==v)col=shade(p,.28);
    else if(at(x+1,y+1)!==v)col=shade(p,-.3);
    else if(at(x,y+2)!==v||at(x+2,y)!==v)col=shade(p,-.14);
    q.fillStyle=col;q.fillRect(x,y,1,1);
  }
  return SPR[key]=c;
}
// All-white copy of a sprite, for the hit flash
function whiteSpr(key,s){
  const k=key+'#w'; if(SPR[k])return SPR[k];
  const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const q=c.getContext('2d');
  q.drawImage(s,0,0);q.globalCompositeOperation='source-in';q.fillStyle='#fff';q.fillRect(0,0,c.width,c.height);
  return SPR[k]=c;
}

// ── 3×5 pixel font ──
const FONT={A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'1000111011101011000110001',N:'110101101101101',O:'111101101101111',P:'110101110100100',Q:'010101101111011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'1000110001101011101110001',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
  0:'111101101101111',1:'010110010010111',2:'111001111100111',3:'111001111001111',4:'101101111001001',5:'111100111001111',6:'111100111101111',7:'111001001001001',8:'111101111101111',9:'111101111001111',
  '!':'010010010000010','.':'000000000000010',':':'000010000010000','-':'000000111000000','+':'000010111010000','*':'000101010101000','/':'001001010100100','%':'101001010100101',"'":'010010000000000',',':'000000000010100','?':'111001010000010'};
const gw=ch=>{const d=FONT[ch];return d&&d.length===25?5:3;};
const textW=str=>{let w=-1;for(const ch of str)w+=gw(ch)+1;return w;};
function glyphs(str,x,y,col,s){g.fillStyle=col;for(const ch of str){const d=FONT[ch],w=gw(ch);if(d)for(let i=0;i<d.length;i++)if(d[i]==='1')g.fillRect(x+(i%w)*s,y+((i/w)|0)*s,s,s);x+=(w+1)*s;}}
// align: 0 left, 1 centre, 2 right. out: outline colour or null
function text(str,x,y,col,o){
  o=o||{}; const s=o.s||1, w=textW(str)*s; x=Math.round(o.al===1?x-w/2:o.al===2?x-w:x); y=Math.round(y);
  if(o.out){glyphs(str,x-1,y,o.out,s);glyphs(str,x+1,y,o.out,s);glyphs(str,x,y-1,o.out,s);glyphs(str,x,y+1,o.out,s);}
  glyphs(str,x,y,col,s);
}
function bar(x,y,w,h,f,col,back){g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);g.fillStyle=back;g.fillRect(x,y,w,h);const fw=Math.round(w*clamp(f,0,1));if(fw>0){g.fillStyle=col;g.fillRect(x,y,fw,h);g.fillStyle=shade(col,.35);g.fillRect(x,y,fw,1);}}
function ring(cx,cy,r,col){g.fillStyle=col;const n=Math.max(12,Math.round(r*5));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*.55),1,1);}}

// ── Monster: the Fernwing, a forest wyvern ──
const MS_W=88, MS_H=68, MS_OX=8, MS_OY=8;      // sprite size and the margin the head and wings move in
function wyvernSpr(p,flash){
  const key=`wy:${p.hx}:${p.hy}:${p.jaw}:${p.wing}:${p.tail}:${p.horn?1:0}:${p.spike?1:0}:${p.glow}:${p.rage}:${p.torn?1:0}:${p.kind|0}`;
  const E=p.kind===1, mouth=['!#141826','!#ff9a2e','!#ffd34d','!#fff6c0'][E?Math.max(1,p.glow):p.glow];   // the Emberwing's mouth always glows
  const pal=E?{1:'#b8402e',2:'#f0b070',3:'!#141826',4:p.rage?'!#ffffff':'!#ffe14d',5:'#4a3c48',6:'#6a1f24',7:mouth}
             :{1:'#3f9e8a',2:'#d9c88e',3:'!#141826',4:p.rage?'!#ff4030':'!#ffe14d',5:'#e8e2cc',6:'#2c7366',7:mouth};
  const s=shapeSpr(key,MS_W,MS_H,pal,a=>{
    a.off(MS_OX,MS_OY);
    const hx=p.hx,hy=p.hy,t=p.tail;
    // far wing
    if(p.wing===0)a.poly([[44,20],[60,2],[74,6],[70,14],[62,12],[58,24]],6);
    else if(p.wing===1)a.poly([[44,20],[56,-6],[76,-4],[70,6],[62,4],[58,24]],6);
    else a.poly([[44,24],[62,28],[76,38],[66,36],[58,34]],6);
    a.poly([[46,30],[64,34],[75,42+t],[62,38+t/2],[48,38]],1);                 // tail
    if(p.spike){if(E)a.ell(73,42+t,4,4,5);else a.poly([[70,36+t],[76,42+t],[69,44+t]],5);}
    a.rect(38,40,4,12,6); a.rect(37,50,6,3,5);                                  // back leg
    a.ell(38,30,13,9,1); a.ell(36,34,9,5,2);                                    // body, belly
    a.poly([[30,24],[22+hx,14+hy],[18+hx,16+hy],[26,30]],1);                    // neck
    a.ell(16+hx,14+hy,8,6,1);                                                   // head
    a.poly([[4+hx,14+hy],[12+hx,10+hy],[12+hx,20+hy],[3+hx,18+hy]],1);          // snout
    if(p.jaw>0)a.poly([[5+hx,18+hy],[12+hx,18+hy],[12+hx,19+hy+p.jaw],[5+hx,18+hy+p.jaw]],7); // open mouth
    a.poly([[4+hx,18+hy+p.jaw],[12+hx,18+hy+p.jaw],[11+hx,21+hy+p.jaw],[5+hx,20+hy+p.jaw]],2); // lower jaw
    a.px(6+hx,17+hy,5);a.px(8+hx,17+hy,5);a.px(10+hx,17+hy,5);                  // teeth
    if(p.horn){if(E){a.poly([[18+hx,9+hy],[32+hx,4+hy],[30+hx,-2+hy],[28+hx,3+hy],[22+hx,11+hy]],5);a.poly([[14+hx,8+hy],[16+hx,-2+hy],[20+hx,-4+hy],[19+hx,9+hy]],5);}
      else{a.poly([[18+hx,9+hy],[28+hx,2+hy],[22+hx,11+hy]],5);a.poly([[15+hx,8+hy],[20+hx,1+hy],[19+hx,9+hy]],5);}}
    else{a.rect(19+hx,8+hy,3,2,5);a.rect(15+hx,7+hy,2,2,5);}                     // broken stumps
    a.px(13+hx,12+hy,4);a.px(14+hx,12+hy,4);a.px(13+hx,13+hy,3);                // eye
    // near wing
    if(p.wing===0){a.poly([[34,22],[44,4],[54,8],[46,26]],6);a.poly([[44,4],[40,0],[46,3]],5);}
    else if(p.wing===1){a.poly([[34,22],[40,-6],[58,-2],[48,26]],6);a.poly([[40,-6],[37,-8],[42,-6]],5);}
    else a.poly([[34,24],[48,30],[60,46],[50,42],[40,34]],6);
    if(p.torn)for(const[x,y]of p.wing===0?[[44,11],[45,12],[45,13],[49,15],[50,16],[42,18],[43,19],[50,9],[47,21],[47,22]]:p.wing===1?[[44,3],[45,4],[45,5],[50,1],[51,2],[42,11],[43,12],[47,14],[47,15],[52,8]]:[[44,30],[45,31],[48,34],[49,35],[52,39],[53,40],[46,36]])a.px(x,y,0);
    a.rect(30,38,4,14,1); a.rect(29,50,6,3,5);                                  // front leg
    for(let i=0;i<4;i++)a.poly([[34+i*5,21],[36+i*5,E?13+(i%2)*2:17],[38+i*5,21]],5);        // back ridge
  });
  return flash?whiteSpr(key,s):s;
}

// ── Hunter ──
const HS_W=46, HS_H=42;
const H_PAL={1:'#f0c098',2:'#8a3b2a',3:'#b0b8c8',4:'!#141826',5:'#dde4f0',6:'#6b4a2e',8:'!#ffe14d',9:'!#ff9a2e',10:'!#ffffff',11:'!#e2483d'};
function hunterSpr(p){
  const aq=Math.round(p.a*5);                                                    // sword angle in 0.2 rad steps
  const eq=SAVE.eq, key=`hu:${p.kind}:${aq}:${p.bob}:${p.lean}:${p.glow}:${p.f}:${eq.weapon}:${eq.armor}`;
  const ar={leather:['#8a3b2a','#b0b8c8','#6b4a2e'],fmail:['#2f8f7a','#d9c88e','#1f5a50'],eplate:['#7a2a2a','#4a3c48','#2a1a1e']}[eq.armor];
  const pal=Object.assign({},H_PAL,{2:ar[0],3:ar[1],6:ar[2],5:{iron:'#dde4f0',fblade:'#8fe8c8',eblade:'#ff9a4d'}[eq.weapon]});
  return shapeSpr(key,HS_W,HS_H,pal,a=>{
    a.off(4,2);
    if(p.kind==='roll'){
      if(p.f){a.ell(14,31,7,6,2);a.ell(17,28,4,4,3);a.rect(8,34,5,2,6);}
      else{a.ell(14,31,7,6,2);a.ell(10,33,4,4,3);a.rect(15,26,5,2,6);}
      return;
    }
    if(p.kind==='down'){a.rect(4,33,16,5,2);a.rect(4,35,6,3,6);a.ell(23,34,4,4,3);a.rect(28,37,12,1,5);return;}
    const b=p.bob, l=p.lean;
    a.rect(9,31,4,7,6); a.rect(15,31,4,7,6);                                     // legs
    a.rect(8+l,18+b,12,14-b,2); a.rect(8+l,25+b,12,2,6);                         // armour, belt
    a.ell(14+l,13+b,5,5,1);                                                      // head
    a.poly([[8+l,11+b],[14+l,6+b],[20+l,11+b],[20+l,14+b],[9+l,14+b]],3);        // helmet
    a.rect(15+l,13+b,3,1,4);                                                     // visor
    a.rect(6+l,18+b,4,4,3); a.rect(18+l,18+b,4,4,3);                             // pauldrons
    const hx=21+l,hy=24+b, c=Math.cos(aq/5), s=Math.sin(aq/5), L=17, col=p.glow?7+p.glow:5;
    a.poly([[hx-s,hy+c],[hx+s,hy-c],[hx+c*L+s,hy+s*L-c],[hx+c*(L+2),hy+s*(L+2)],[hx+c*L-s,hy+s*L+c]],col); // blade
    a.rect(hx-1,hy-1,3,3,6);                                                     // grip
    if(p.kind==='drink')a.rect(17+l,11+b,3,5,11);
  });
}

const LOOT={
  scale:{name:'FERN SCALE', pal:{1:'#3f9e8a',2:'#2c7366'}, draw:a=>{a.poly([[5,0],[10,5],[5,10],[0,5]],1);a.poly([[5,5],[8,6],[5,9],[2,6]],2);}},
  claw: {name:'WYVERN CLAW',pal:{1:'#e8e2cc',2:'#6b4a2e'}, draw:a=>{a.poly([[1,1],[4,0],[9,6],[9,10],[5,6]],1);a.rect(0,0,4,3,2);}},
  horn: {name:'FERNWING HORN',pal:{1:'#e8e2cc',2:'#b9a37a'},draw:a=>{a.poly([[0,9],[9,0],[10,1],[5,10]],1);a.rect(0,8,5,2,2);}},
  spike:{name:'TAIL SPIKE', pal:{1:'#e8e2cc',2:'#3f9e8a'}, draw:a=>{a.poly([[4,0],[9,8],[1,8]],1);a.rect(2,8,7,2,2);}},
  wing: {name:'WING MEMBRANE',pal:{1:'#2c7366',2:'#e8e2cc'},draw:a=>{a.poly([[0,9],[2,1],[10,0],[8,5],[6,4],[5,8],[3,7]],1);a.rect(1,0,2,3,2);}},

};
for(const [k,name,pal] of [['scale','EMBER SCALE',{1:'#b8402e',2:'#6a1f24'}],['claw','EMBER CLAW',{1:'#4a3c48',2:'#6a1f24'}],['horn','EMBER HORN',{1:'#4a3c48',2:'#6a5a6a'}],
  ['spike','CLUB TAIL',{1:'#4a3c48',2:'#b8402e'}],['wing','EMBER WING',{1:'#6a1f24',2:'#4a3c48'}]])LOOT['e_'+k]={name,pal,draw:LOOT[k].draw};

let AC=null, NOISE=null;
function audioInit(){
  if(AC||MH.manual)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    NOISE=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
}
function tone(f0,f1,dur,vol,type,delay){
  if(!AC)return; const t=AC.currentTime+(delay||0),o=AC.createOscillator(),v=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+dur);
}
function noise(dur,vol,freq){
  if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(),v=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=NOISE;f.type='lowpass';f.frequency.value=freq||2000;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(v);v.connect(AC.destination);s.start(t);s.stop(t+dur);
}
const SFX={
  swing(){noise(.07,.12,3500);}, hit(){noise(.08,.25,1800);tone(220,90,.08,.12);}, heavy(){noise(.25,.4,1200);tone(160,40,.3,.25,'sawtooth');},
  charge(l){tone(300+l*180,340+l*180,.09,.12);}, dodge(){noise(.12,.1,5000);}, perfect(){tone(880,1320,.1,.15);tone(1320,1760,.14,.15,'square',.08);},
  hurt(){tone(200,60,.25,.25,'sawtooth');noise(.15,.25,900);}, warn(){tone(990,990,.06,.08);}, roar(){tone(120,50,.9,.3,'sawtooth');noise(.9,.3,700);},
  brk(){noise(.3,.4,2500);tone(660,220,.3,.2);}, heal(){tone(520,780,.12,.12);tone(780,1040,.16,.12,'square',.1);},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,f,.18,.15,'square',i*.13));}, lose(){[392,330,262,196].forEach((f,i)=>tone(f,f,.25,.15,'square',i*.2));},
  loot(){tone(1047,1568,.08,.12);}, miss(){tone(180,140,.06,.06);}
};
function sfx(n,a){if(AC)SFX[n](a);}
function buzz(ms){if(!MH.manual&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

// ── Save: bag of materials, owned and worn gear, wins per monster. On this device only.
const SAVE_KEY='mh_save_v1';
function loadSave(){
  let v=null; try{v=JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){}
  if(!v){v={};try{const old=JSON.parse(localStorage.getItem('mh_proto_bag'));if(old)v.bag=old;}catch(e){}}   // loot from the first prototypes carries over
  v.bag=v.bag||{};v.own=v.own||{};v.wins=v.wins||{};v.eq=Object.assign({weapon:'iron',armor:'leather',charm:null},v.eq);v.own.iron=v.own.leather=true;
  for(const sl of ['weapon','armor','charm'])if(v.eq[sl]&&!(GEAR[v.eq[sl]]&&v.own[v.eq[sl]]))v.eq[sl]={weapon:'iron',armor:'leather',charm:null}[sl];
  return v;
}

function mAir(){const m=S.m;if(m.state!=='attack'||m.atk!=='dive')return false;const h=m.hits[0];return m.t>h*.3&&m.t<h-.06;}
// Pose and position offset for the current state
function mPose(){
  const m=S.m, p={hx:0,hy:0,jaw:0,wing:0,tail:0,glow:0,ox:0,oy:0};
  const idle=Math.sin(S.clock*2.4);
  p.hy=idle>.3?1:0; p.tail=idle<-.3?-2:0;
  if(m.state==='idle'&&mWary()){p.wing=1;p.hx=2;p.hy=2;p.oy=2;p.tail=-4;}        // wary: wings up, it will dodge the next hit
  else if(m.state==='evade'){const u=Math.sin(Math.PI*clamp(m.t/EVADE_DUR,0,1));p.ox=Math.round(16*u);p.oy=-Math.round(12*u);p.wing=Math.floor(m.t*8)%2?1:2;p.hx=2;}
  if(m.state==='attack'){
    const t=m.t,h0=m.hits[0],a=m.atk;
    if(a==='bite'||a==='dbl'||a==='tri'){
      let k=-1;for(let i=0;i<m.hits.length;i++)if(t>=m.hits[i]-.07&&t<m.hits[i]+.2)k=i;
      if(k>=0){p.hx=-8;p.hy=3;p.jaw=1;p.ox=-14;}
      else{const nx=m.hits[Math.min(m.hi,m.hits.length-1)],prev=m.hi?m.hits[m.hi-1]+.2:0,u=ease((t-prev)/Math.max(.01,nx-.07-prev));
        p.hx=Math.round(6*u);p.hy=-Math.round(3*u);p.jaw=3;p.ox=Math.round(3*u);}
    }else if(a==='tail'){
      if(t<h0-.08){const u=ease(t/(h0-.08));p.tail=-Math.round(12*u);p.ox=Math.round(5*u);p.hx=3;p.wing=1;}
      else if(t<h0+.25){p.tail=6;p.ox=-10;p.hx=-3;p.hy=3;}
    }else if(a==='fire'){
      if(t<h0-.08){const u=t/(h0-.08);p.hx=Math.round(4*ease(u));p.hy=-Math.round(7*ease(u));p.jaw=1;p.glow=1+Math.min(2,Math.floor(u*3));}
      else if(t<m.hits[1]+.2){p.hx=-6;p.hy=4;p.jaw=3;p.glow=3;}
    }else if(a==='dive'){
      const up=h0*.3;
      if(t<up){p.wing=(Math.floor(t*10)%2)?1:2;p.oy=-Math.round(4*t/up);p.hy=-2;}
      else if(t<h0-.14){p.wing=(Math.floor(t*10)%2)?1:2;p.oy=-Math.round(lerp(4,LH,ease((t-up)/(h0*.25))));p.ox=-24;}
      else if(t<h0){p.wing=1;p.ox=-24;p.oy=-Math.round(LH*(h0-t)/.14);p.jaw=2;}
      else{p.wing=2;p.ox=-24;p.hy=4;p.jaw=2;}
    }
  }else if(m.state==='recover'){
    if(m.atk==='dive')p.ox=-Math.round(24*(1-ease(m.t/m.rec*1.6)));
    p.hy=3;p.jaw=1;                                                             // panting: the opening
  }else if(m.state==='stagger'){if(!m.stunned&&m.staggerDur<1){p.hx=5;p.hy=-2;p.jaw=2;p.ox=4;return p;}p.hx=-2;p.hy=9;p.jaw=2;p.wing=2;p.tail=4;p.oy=3;}
  else if(m.state==='roar'){p.hx=-3;p.hy=-8;p.jaw=3;p.wing=1;p.ox=Math.round(Math.sin(S.clock*60));}
  else if(m.state==='dead'){const u=ease(m.t/.8);p.hx=-2;p.hy=Math.round(11*u);p.jaw=2;p.wing=2;p.tail=Math.round(6*u);p.oy=Math.round(5*u);}
  return p;
}
function mHeadPos(p){return{x:L.mx+MS_OX+12+p.hx+p.ox,y:L.my+MS_OY+14+p.hy+p.oy};}
function partAt(x,y){
  const p=mPose(), sx=L.mx+p.ox, sy=L.my+p.oy;
  if(x>=sx+p.hx-2&&x<=sx+p.hx+40&&y>=sy+p.hy-4&&y<=sy+p.hy+36)return'head';
  if(x>=sx+MS_OX+56&&y>=sy+MS_OY+18&&y<=sy+MS_OY+58)return'tail';
  return'body';
}
function partPos(part,p){
  if(part==='head')return{x:L.mx+MS_OX+14+p.hx+p.ox,y:L.my+MS_OY+14+p.hy+p.oy};
  if(part==='tail')return{x:L.mx+MS_OX+66+p.ox,y:L.my+MS_OY+40+p.tail+p.oy};
  if(part==='wings'){const w=[[46,14],[48,7],[49,34]][p.wing];return{x:L.mx+MS_OX+w[0]+p.ox,y:L.my+MS_OY+w[1]+p.oy};}
  return{x:L.mx+MS_OX+36+p.ox,y:L.my+MS_OY+30+p.oy};
}
const mWary=()=>{const m=S.m;return m.state==='idle'&&m.evadeCd<=0&&!m.roarDue;};
function mStartAttack(){
  const m=S.m, pool=S.def.pools[m.phase]; let id;
  do{id=pool[(Math.random()*pool.length)|0];}while(id===m.last&&Math.random()<.7);
  const A=ATTACKS[id], sp=S.def.speed[m.phase], w=A.wind*sp;
  m.state='attack';m.t=0;m.atk=id;m.last=id;m.hi=0;m.hits=A.hits.map(o=>w+o);m.dur=m.hits[m.hits.length-1]+A.after;m.rec=A.rec;
  sfx('warn');
}
function mStagger(d,stun){const m=S.m;if(m.state==='stagger'&&m.staggerDur-m.t>d)return;m.state='stagger';m.t=0;m.staggerDur=d;m.stunned=!!stun;}
function mUpdate(dt){
  const m=S.m; m.t+=dt; if(m.flash>0)m.flash-=dt; if(m.evadeCd>0&&m.state!=='stagger')m.evadeCd-=dt;
  if(m.state==='dead')return;
  if(m.state==='idle'){
    if(m.roarDue){m.roarDue=false;m.state='roar';m.t=0;S.shake=.9;sfx('roar');buzz(200);
      addNum(W/2,L.ground-14,m.phase===2?'ENRAGED!':'ANGRY!','#ff6a4d',1.4);}
    else if((m.wait-=dt)<=0&&S.h.state!=='dead')mStartAttack();
  }else if(m.state==='attack'){
    while(m.hi<m.hits.length&&m.t>=m.hits[m.hi]){mHit(m.hi);m.hi++;if(m.state!=='attack')return;}
    if(m.atk==='fire'&&m.t>m.hits[0]-.08&&m.t<m.hits[1]+.15){                  // flame stream
      const hp=mHeadPos(mPose());for(let i=0;i<3;i++)S.pt.push({x:hp.x-8,y:hp.y+6,vx:rnd(-120,-70),vy:rnd(10,60),life:rnd(.25,.5),col:['#ff9a2e','#ffd34d','#e2483d'][i],g:-40});
    }
    if(m.t>=m.dur){m.state='recover';m.t=0;}
  }else if(m.state==='recover'){if(m.t>=m.rec){m.state='idle';m.wait=rnd(.5,1.1)*S.def.speed[m.phase];}}
  else if(m.state==='stagger'){if(m.t>=m.staggerDur){m.state='idle';m.wait=.5;m.stunned=false;}}
  else if(m.state==='evade'){if(m.t>=EVADE_DUR){m.state='idle';m.wait=m.phase?.15:.4;}}
  else if(m.state==='roar'){if(m.t>=1.2){m.state='idle';m.wait=.35;}}
}
// One of the monster's hits lands (or is dodged)
function mHit(i){
  const m=S.m,h=S.h,A=ATTACKS[m.atk]; let dmg=A.dmg; if(m.atk==='tail'&&m.parts.tail.broken)dmg=10; dmg=Math.round(dmg*S.def.dmg);
  const hc={x:L.hx+18+hunterX(),y:L.hFeet-18};
  if(m.atk==='dive'){S.shake=.5;for(let k=0;k<18;k++)S.pt.push({x:rnd(20,90),y:L.mFeet+2,vx:rnd(-60,60),vy:rnd(-90,-20),life:rnd(.3,.7),col:'#a5d86a',g:260});sfx('heavy');buzz(60);}
  if(m.atk==='tail')for(let k=0;k<12;k++)S.pt.push({x:rnd(10,70),y:L.hFeet-rnd(0,8),vx:rnd(-90,-20),vy:rnd(-40,0),life:rnd(.2,.5),col:'#d9c88e',g:150});
  if(h.state==='dead'||h.state==='win'||h.state==='counter')return;
  if(h.state==='dodge'&&h.t<DODGE_IFR){
    S.stats.dodges++;
    if(h.t<=PERFECT_WIN){S.stats.perfect++;h.counter=COUNTER_WIN;h.st=Math.min(100,h.st+25);S.slow=.4;addNum(hc.x+8,hc.y-22,'PERFECT!','#ffe14d',1.1);sfx('perfect');
      for(let k=0;k<10;k++)S.pt.push({x:hc.x,y:hc.y,vx:rnd(-50,50),vy:rnd(-70,-10),life:.5,col:'#ffe14d',g:60});}
    else addNum(hc.x+6,hc.y-20,'DODGE','#c8d0e8',.7);
    return;
  }
  if(h.inv>0)return;
  h.hp-=dmg;S.stats.taken+=dmg;h.state='hurt';h.t=0;h.charge=0;h.lvl=0;h.buf=0;h.buff=0;
  S.shake=Math.max(S.shake,.35);S.stop=.06;addNum(hc.x+4,hc.y-18,''+dmg,'#ff6a4d',.9);sfx('hurt');buzz(80);
  for(let k=0;k<8;k++)S.pt.push({x:hc.x,y:hc.y,vx:rnd(-80,10),vy:rnd(-80,-10),life:.4,col:'#e2483d',g:220});
  if(h.hp<=0){h.hp=0;h.state='dead';S.endT=0;S.fail='YOU FAINTED';sfx('lose');}
}

// ═══════════════════════════════════════════════════
//  HUNTER
// ═══════════════════════════════════════════════════
function hunterX(){const h=S.h;
  if(h.state==='dodge')return Math.round(h.dir*16*Math.sin(Math.PI*h.t/DODGE_DUR));
  if(h.state==='hurt')return -Math.round(7*Math.sin(Math.PI*Math.min(1,h.t/.45)));
  if(h.state==='atk')return h.combo===2?3:1;
  if(h.state==='heavy')return 4;
  if(h.state==='counter')return Math.round(26*Math.sin(Math.PI*clamp(h.t/.5,0,1)));
  return 0;
}
function addNum(x,y,txt,col,life){S.nums.push({x,y,txt,col,t:0,life:life||.8});}
function dealDamage(base,part,heavy,stun){
  const m=S.m,h=S.h; if(m.state==='dead')return;
  const pose=mPose();
  if(mAir()){addNum(60,L.mFeet-40,'MISS','#8a93b0',.5);sfx('miss');return;}
  if(mWary()){                                                                   // it hops back and the hit misses
    m.state='evade';m.t=0;m.evadeCd=S.def.evadeCd[m.phase];S.stats.evaded++;const hp=mHeadPos(pose);
    addNum(hp.x+6,hp.y-14,'DODGED!','#c8d0e8',1.1);sfx('dodge');
    for(let k=0;k<8;k++)S.pt.push({x:L.mx+MS_OX+rnd(26,46),y:L.mFeet,vx:rnd(-50,10),vy:rnd(-40,-5),life:rnd(.2,.4),col:'#d9c88e',g:150});
    return;
  }
  if(m.state==='evade'&&m.t<EVADE_DUR-.2){addNum(60,L.mFeet-40,'MISS','#8a93b0',.5);sfx('miss');return;}
  let mult=1; if(h.buff>0)mult*=1.5; if(m.state==='stagger')mult*=1.25; if(part==='head')mult*=1.15;
  const dmg=Math.round(base*h.atk*mult*rnd(.92,1.08)), pp=partPos(part,pose);
  m.hp-=dmg;S.stats.dealt+=dmg;m.flash=.09;S.stop=Math.max(S.stop,heavy?.1:.035);S.shake=Math.max(S.shake,heavy?.4:.12);
  addNum(pp.x+rnd(-6,6),pp.y-10,''+dmg,heavy||mult>1.2?'#ffe14d':'#fff3a0',heavy?1:.7);
  S.fx.push({kind:'slash',x:pp.x,y:pp.y,t:0,big:heavy,flip:h.combo===1});
  for(let k=0;k<(heavy?12:5);k++)S.pt.push({x:pp.x,y:pp.y,vx:rnd(-70,70),vy:rnd(-90,-10),life:rnd(.2,.5),col:k%2?'#fff':S.def.blood,g:240});
  sfx(heavy?'heavy':'hit');buzz(heavy?40:10);
  if(m.hp<=0){m.hp=0;m.state='dead';m.t=0;S.slow=1.2;S.endT=0;h.state='win';h.t=0;S.shake=.7;return;}
  if(stun&&!m.stunned&&(m.stun+=stun)>=m.stunMax){                               // stun meter full: the monster goes down
    m.stun=0;m.stunMax+=STUN_GROW;S.stats.stuns++;mStagger(STUN_TIME,true);
    addNum(pp.x,pp.y-30,'STUNNED!','#ffe14d',1.4);sfx('brk');buzz(150);S.shake=.7;S.stop=.14;
  }
  const ph=m.hp<=m.max/3?2:m.hp<=m.max*2/3?1:0;
  if(ph>m.phase){m.phase=ph;m.roarDue=true;if(m.state==='attack'||m.state==='recover'){m.state='idle';m.wait=0;}}
}
// ── Weak points ──
function qteUpdate(dt){
  const m=S.m,h=S.h;
  if(S.qte){S.qte.t+=dt;
    if(m.state==='dead'||h.state==='dead'){S.qte=null;return;}
    if(S.qte.t>=S.qteTime){const pp=partPos(S.qte.part,mPose());addNum(pp.x,pp.y-12,'TOO SLOW','#8a93b0',.6);S.stats.qteMiss++;S.qte=null;m.qteT=rnd(QTE_GAP[0],QTE_GAP[1]);}
    return;}
  const ok=(m.state==='idle'||m.state==='attack'||m.state==='recover'||m.state==='stagger')&&!mAir()&&h.state!=='dead'&&h.state!=='win';
  if(!ok||(m.qteT-=dt)>0)return;
  const left=PARTS.filter(k=>!m.parts[k].broken); if(!left.length)return;
  let part=left[0];const i0=PARTS.indexOf(m.qteLast);for(let i=1;i<=PARTS.length;i++){const k=PARTS[(i0+i)%PARTS.length];if(!m.parts[k].broken){part=k;break;}}   // take turns, so every part gets its share
  m.qteLast=part;S.qte={part,t:0};sfx('charge',1);
}
// A tap at (x,y): does it land on the open weak point?
function qteTap(x,y){
  const q=S.qte,h=S.h,m=S.m; if(!q||h.state==='dead'||h.state==='win'||h.state==='hurt')return false;
  const pp=partPos(q.part,mPose()); if((x-pp.x)**2+(y-pp.y)**2>QTE_R*QTE_R)return false;
  S.qte=null;m.qteT=rnd(QTE_GAP[0],QTE_GAP[1]);S.stats.qteHit++;
  const P=m.parts[q.part];P.hits++;
  if(h.state==='idle'||h.state==='atk'){h.combo=(h.combo+1)%3;h.state='atk';h.t=0;h.hitDone=true;h.buf=0;}   // swing for show: the hit is dealt here
  const qd=Math.round(QTE_DMG*h.atk);m.hp-=qd;S.stats.dealt+=qd;m.flash=.09;S.stop=.07;S.shake=Math.max(S.shake,.3);
  S.fx.push({kind:'slash',x:pp.x,y:pp.y,t:0,big:true,flip:false});
  for(let k=0;k<10;k++)S.pt.push({x:pp.x,y:pp.y,vx:rnd(-80,80),vy:rnd(-100,-10),life:rnd(.2,.5),col:k%2?'#fff':'#ff6a4d',g:240});
  addNum(pp.x,pp.y-12,P.hits+'/'+S.qteHits,'#ffffff',.9);sfx('heavy');buzz(30);
  if(P.hits>=S.qteHits){
    P.broken=true;addNum(pp.x,pp.y-24,'BREAK!','#ffe14d',1.3);sfx('brk');buzz(120);S.shake=.6;S.stop=.14;
    for(let k=0;k<14;k++)S.pt.push({x:pp.x,y:pp.y,vx:rnd(-90,90),vy:rnd(-130,-30),life:rnd(.4,.8),col:'#e8e2cc',g:300});
    if(m.hp>0)mStagger(2);
  }
  if(m.hp<=0){m.hp=0;m.state='dead';m.t=0;S.slow=1.2;S.endT=0;h.state='win';h.t=0;S.shake=.7;return true;}
  if(q.part==='head'&&!m.stunned&&(m.stun+=QTE_STUN)>=m.stunMax){m.stun=0;m.stunMax+=STUN_GROW;S.stats.stuns++;mStagger(STUN_TIME,true);addNum(pp.x,pp.y-34,'STUNNED!','#ffe14d',1.4);}
  const ph=m.hp<=m.max/3?2:m.hp<=m.max*2/3?1:0;
  if(ph>m.phase){m.phase=ph;m.roarDue=true;if(m.state==='attack'||m.state==='recover'){m.state='idle';m.wait=0;}}
  return true;
}
function hStartAtk(part){const h=S.h;h.combo=(h.state==='atk'||h.comboT>0)?(h.combo+1)%3:0;h.state='atk';h.t=0;h.hitDone=false;h.target=part;h.buf=0;sfx('swing');}
function hUpdate(dt){
  const h=S.h; h.t+=dt;
  if(h.inv>0)h.inv-=dt; if(h.buff>0)h.buff-=dt; if(h.counter>0)h.counter-=dt; if(h.comboT>0)h.comboT-=dt; if(h.buf>0)h.buf-=dt;
  if(h.stDelay>0)h.stDelay-=dt; else h.st=Math.min(100,h.st+32*dt);
  if(h.state==='atk'){
    if(!h.hitDone&&h.t>=TAP_HIT[h.combo]){h.hitDone=true;dealDamage(TAP_DMG[h.combo],h.target,false,h.target==='head'?STUN_TAP:0);}
    if(h.t>=TAP_DUR[h.combo]){if(h.buf>0&&h.state==='atk')hStartAtk(h.bufPart);else if(h.state==='atk'){h.state='idle';h.comboT=.45;}}
  }else if(h.state==='charge'){
    h.charge+=dt;const l=h.charge>=CHARGE_AT[2]?3:h.charge>=CHARGE_AT[1]?2:h.charge>=CHARGE_AT[0]?1:0;
    if(l>h.lvl){h.lvl=l;sfx('charge',l);buzz(15);}
    if(!IN.down)hRelease();
  }else if(h.state==='heavy'){
    if(!h.hitDone&&h.t>=.14){h.hitDone=true;dealDamage(HEAVY_DMG[h.lvl],h.target,true,h.target==='head'?STUN_HEAVY[h.lvl]:0);}
    if(h.t>=.5&&h.state==='heavy'){h.state='idle';h.lvl=0;}
  }else if(h.state==='counter'){
    if(!h.hitDone&&h.t>=.16){h.hitDone=true;const m=S.m;dealDamage(COUNTER_DMG,'head',true,COUNTER_STUN);
      if(m.state==='attack'||m.state==='recover')mStagger(.8);}                  // the counter knocks it out of its attack
    if(h.t>=.5&&h.state==='counter'){h.state='idle';h.inv=.3;}
  }else if(h.state==='dodge'){if(h.t>=DODGE_DUR)h.state='idle';}
  else if(h.state==='hurt'){if(h.t>=.45){h.state='idle';h.inv=.7;}}
  else if(h.state==='drink'){
    if(!h.drank&&h.t>=.6){h.drank=true;h.potions--;const heal=Math.round(h.max*POTION_HEAL);h.hp=Math.min(h.max,h.hp+heal);addNum(L.hx+18,L.hFeet-34,'+'+heal,'#4cd964',.9);sfx('heal');}
    if(h.t>=.9)h.state='idle';
  }
  if(h.state==='idle'){
    if(h.buf>0)hStartAtk(h.bufPart);
    else if(IN.down&&S.clock-IN.downAt>.22&&!IN.swiped){h.state='charge';h.t=0;h.charge=0;h.lvl=0;h.target=IN.part;}
  }
}
function hRelease(){const h=S.h;if(h.state!=='charge')return;
  if(h.lvl>0){h.state='heavy';h.t=0;h.hitDone=false;h.combo=2;sfx('swing');}else{h.state='idle';h.charge=0;}}
// ── Player actions ──
function actTap(part){const h=S.h;
  if(h.state==='idle')hStartAtk(part);
  else if(h.state==='atk'||h.state==='dodge'||h.state==='heavy'){h.buf=.3;h.bufPart=part;}}
function actCounter(){const h=S.h;
  if(h.counter<=0||h.state==='hurt'||h.state==='dead'||h.state==='win')return false;
  h.counter=0;h.state='counter';h.t=0;h.hitDone=false;h.charge=0;h.lvl=0;h.buf=0;h.combo=2;S.slow=0;S.stats.counters++;sfx('perfect');return true;}
function actDodge(dir){const h=S.h;
  if(h.state==='hurt'||h.state==='dead'||h.state==='win'||h.state==='dodge'||h.state==='counter')return;
  if(h.state==='drink'&&h.drank)return;
  if(h.st<DODGE_COST){addNum(L.hx+18,L.hFeet-34,'TIRED','#f5c542',.5);return;}
  h.st-=DODGE_COST;h.stDelay=.6;h.state='dodge';h.t=0;h.dir=dir;h.charge=0;h.lvl=0;h.buf=0;sfx('dodge');}
function actPotion(){const h=S.h;
  if(!(h.state==='idle'||h.state==='atk'||h.state==='charge'))return;
  if(h.potions<=0||h.hp>=h.max){sfx('miss');return;}
  h.state='drink';h.t=0;h.drank=false;h.charge=0;h.lvl=0;h.buf=0;}

const IN={down:false,downAt:0,x0:0,y0:0,swiped:false,part:'body',id:-1};
function toLogical(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*LH};}
function press(x,y){
  audioInit(); if(AC&&AC.state==='suspended')AC.resume();
  if(S.mode==='title'){toCamp('hunt');return;}
  if(S.mode==='loot'||S.mode==='fail'){if(S.t>1.2)toCamp('hunt');return;}
  if(S.mode==='camp'){for(const b of S.btns)if(x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h){b.fn();break;}return;}
  if(S.mode!=='hunt')return;
  const b=L.potion; if(x>=b.x-2&&x<=b.x+b.w+2&&y>=b.y-2){actPotion();return;}
  const c=L.counter; if(S.h.counter>0&&x>=c.x-10&&x<=c.x+c.w+10&&y>=c.y-8&&y<=c.y+c.h+8&&actCounter())return;
  if(qteTap(x,y))return;
  IN.down=true;IN.downAt=S.clock;IN.x0=x;IN.y0=y;IN.swiped=false;IN.part=partAt(x,y);
  actTap(IN.part);return true;
}
function move(x,y){
  if(!IN.down||IN.swiped||S.mode!=='hunt')return;
  const dx=x-IN.x0,dy=y-IN.y0;
  if(Math.abs(dx)<9&&Math.abs(dy)<9)return;
  IN.swiped=true;IN.down=false;
  if(-dy>Math.abs(dx)*1.2)actPotion();else actDodge(dx<0?-1:1);
}
function release(){if(!IN.down)return;IN.down=false;if(S.mode==='hunt')hRelease();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=toLogical(e);if(press(p.x,p.y))IN.id=e.pointerId;});   // a weak-point tap with a second finger leaves a held charge alone
cv.addEventListener('pointermove',e=>{if(e.pointerId!==IN.id)return;const p=toLogical(e);move(p.x,p.y);});
cv.addEventListener('pointerup',e=>{if(e.pointerId===IN.id)release();});
cv.addEventListener('pointercancel',e=>{if(e.pointerId===IN.id)release();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
// Keyboard: J or Space attack the head (hold to charge), K the tail, A/D or arrows dodge, W or Q potion
addEventListener('keydown',e=>{
  if(e.repeat)return; const k=e.key.toLowerCase();
  if(k===' '||k==='j'||k==='k'||k==='enter'){e.preventDefault();audioInit();
    if(S.mode!=='hunt'){press(0,0);return;}
    if(S.h.counter>0&&actCounter())return;
    if(S.qte){const pp=partPos(S.qte.part,mPose());if(qteTap(pp.x,pp.y))return;}   // keyboard: the attack key also hits an open weak point
    IN.down=true;IN.downAt=S.clock;IN.swiped=false;IN.part=k==='k'?'tail':'head';actTap(IN.part);}
  else if(S.mode==='hunt'){
    if(k==='a'||k==='arrowleft')actDodge(-1);else if(k==='d'||k==='arrowright')actDodge(1);
    else if(k==='w'||k==='q'||k==='arrowup')actPotion();
  }
});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k===' '||k==='j'||k==='k'||k==='enter')release();});

function rollLoot(){
  const m=S.m,D=S.def,out=[],add=(id,n)=>{if(n>0)out.push({id,n});};
  for(const [id,lo,hi] of D.loot.common)add(id,lo+((Math.random()*(hi-lo+1))|0));
  for(const k of PARTS)add(D.loot.parts[k],m.parts[k].broken?1:(Math.random()<.1?1:0));
  add('gem',Math.random()<.06?1:0);
  for(const d of out)SAVE.bag[d.id]=(SAVE.bag[d.id]||0)+d.n;
  const first=!SAVE.wins[D.id]; SAVE.wins[D.id]=(SAVE.wins[D.id]||0)+1; save();
  const next=first&&HUNTS.map(k=>MONSTERS[k]).find(x=>x.needs===D.id);
  return{drops:out,bag:SAVE.bag,time:HUNT_TIME-S.timeLeft,unlock:next?next.name:''};
}
// ── Camp: pick a hunt, or forge and wear gear ──
function toCamp(tab){S.mode='camp';S.t=0;S.tab=tab||S.tab||'hunt';S.btns=[];S.toast=null;}
function toast(txt,col){S.toast={txt,col:col||'#fff',t:0};}
function forgeTap(id){
  const G=GEAR[id],eq=SAVE.eq;
  if(SAVE.own[id]){
    if(eq[G.slot]===id){if(G.slot!=='charm')return;eq.charm=null;toast('CHARM TAKEN OFF');}
    else{eq[G.slot]=id;toast(G.name+' EQUIPPED','#4cc9ff');}
    sfx('charge',2);
  }else if(canAfford(id)){
    for(const [k,n] of Object.entries(G.cost))SAVE.bag[k]-=n;
    SAVE.own[id]=true;eq[G.slot]=id;toast(G.name+' CRAFTED!','#ffe14d');sfx('win');buzz(60);
  }else{toast('NOT ENOUGH MATERIALS','#ff6a4d');sfx('miss');return;}
  save();
}
function huntTap(id){if(!unlocked(id)){toast('BEAT '+MONSTERS[MONSTERS[id].needs].name+' FIRST','#ff6a4d');sfx('miss');return;}newHunt(id);}
function update(dt){
  S.t+=dt; if(S.toast&&(S.toast.t+=dt)>1.6)S.toast=null;
  if(S.mode!=='hunt')return;
  if(S.stop>0){S.stop-=dt;return;}                                               // hitstop
  if(S.slow>0){S.slow-=dt;dt*=.3;}
  S.clock+=dt;
  if(S.shake>0)S.shake-=dt*1.6;
  const h=S.h,m=S.m, over=h.state==='dead'||m.state==='dead';
  if(!over){S.timeLeft-=dt;if(S.timeLeft<=0){S.timeLeft=0;h.state='dead';S.fail='TIME UP';S.endT=0;sfx('lose');}}
  hUpdate(dt); mUpdate(dt); qteUpdate(dt);
  for(const f of S.fx)f.t+=dt; S.fx=S.fx.filter(f=>f.t<.22);
  for(const p of S.pt){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;} S.pt=S.pt.filter(p=>p.life>0);
  for(const n of S.nums){n.t+=dt;} S.nums=S.nums.filter(n=>n.t<n.life);
  if(h.state==='dead'||m.state==='dead'){
    S.endT+=dt;
    if(m.state==='dead'&&S.endT>1.9){S.loot=rollLoot();S.mode='loot';S.t=0;sfx('win');}
    else if(h.state==='dead'&&S.endT>1.5){S.mode='fail';S.t=0;}
  }
}

const BIOMES=[

  {sky:['#1a0c14','#5a1822','#c2552e'],hills:['#2e1a1e','#1e1114'],ground:['#3a2c28','#2f2320'],speck:'#ff7a2e',rare:.985},  // volcano
];
let BG=null, BGS={};
function bgFor(i){return BGS[i]||(BGS[i]=makeBg(i));}
function makeBg(bi){
  const B=BIOMES[bi], c=document.createElement('canvas');c.width=W+8;c.height=LH;const q=c.getContext('2d'),BW=W+8, gt=L.ground;
  for(let y=0;y<gt+4;y++){const t=y/(gt+4)*2,i=Math.floor(t),f=t-i;for(let x=0;x<BW;x++){const th=[0,.5,.75,.25][(x&1)+(y&1)*2];q.fillStyle=B.sky[Math.min(2,i+(f>th?1:0))];q.fillRect(x,y,1,1);}}

  else{for(let i=0;i<34;i++){q.fillStyle=i%3?'#ff7a2e':'#ffd34d';q.fillRect((hash2(i,1,7)*BW)|0,(hash2(i,2,7)*gt)|0,1,1);}                      // drifting embers
    const vx=96,vy=gt-58;for(let j=0;j<46;j++){const w=6+j*.9;q.fillStyle='#24141a';q.fillRect(Math.round(vx-w),vy+j,Math.round(w*2),1);}          // volcano
    q.fillStyle='#ff7a2e';q.fillRect(vx-5,vy,10,2);q.fillStyle='#ffd34d';q.fillRect(vx-3,vy,6,1);q.fillStyle='#ff7a2e';q.fillRect(vx-1,vy+2,2,9);q.fillRect(vx+1,vy+9,2,8);}
  for(let x=0;x<BW;x++){const h1=gt-38+Math.sin(x*.06)*8+Math.sin(x*.17+1)*4,h2=gt-22+Math.sin(x*.09+2)*6+Math.sin(x*.23)*3;
    q.fillStyle=B.hills[0];q.fillRect(x,h1,1,gt+4-h1);q.fillStyle=B.hills[1];q.fillRect(x,h2,1,gt+4-h2);}
  if(bi===0)[8,22,36,108,122].forEach((tx,k)=>{const base=gt-10+(k%2)*5;for(let j=0;j<18;j++){const w=(j>>1)+1;q.fillStyle=j%5===0?'#1a4a30':'#1f5a38';q.fillRect(tx-w,base-18+j,w*2+1,1);}q.fillStyle='#4a2e1c';q.fillRect(tx,base,2,4);});
  else [10,30,116].forEach((tx,k)=>{const base=gt-4+(k%2)*4;for(let j=0;j<20;j++){const w=(j>>2)+1;q.fillStyle='#140b0e';q.fillRect(tx-w,base-20+j,w*2,1);}});   // rock spires
  for(let y=gt;y<LH;y++)for(let x=0;x<BW;x++){const r=hash2(x>>1,y>>1,1+bi);q.fillStyle=r>B.rare?B.speck:(r>.5?B.ground[0]:B.ground[1]);q.fillRect(x,y,1,1);}

function circ(cx,cy,r,col){g.fillStyle=col;const n=Math.max(16,Math.round(r*6));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r),1,1);}}
function shadow(cx,cy,rx,ry){g.fillStyle='rgba(0,0,0,.28)';for(let y=-ry;y<=ry;y++){const w=Math.round(rx*Math.sqrt(1-(y*y)/(ry*ry+.01)));g.fillRect(Math.round(cx-w),Math.round(cy+y),w*2,1);}}

function hunterPose(){
  const h=S.h, p={kind:'stand',a:-1.2,bob:Math.sin(S.clock*4)>0?1:0,lean:0,glow:0,f:0};
  if(h.buff>0)p.glow=1;
  if(h.state==='atk'){const u=clamp(h.t/(TAP_HIT[h.combo]+.06),0,1);p.bob=0;p.lean=1;
    p.a=h.combo===0?lerp(-2.0,.4,u):h.combo===1?lerp(.6,-1.9,u):lerp(-2.5,.7,u);if(h.combo===2)p.lean=2;}
  else if(h.state==='charge'){p.a=-2.6+(h.lvl?Math.sin(S.clock*50)*.1:0);p.bob=1;p.lean=-1;p.glow=h.lvl===3?(Math.floor(S.clock*14)%2?3:2):h.lvl;}
  else if(h.state==='heavy'){p.a=lerp(-2.7,.9,h.t/.18);p.lean=2;p.bob=0;p.glow=h.lvl;}
  else if(h.state==='counter'){p.a=lerp(-2.7,.9,h.t/.2);p.lean=2;p.bob=0;p.glow=Math.floor(S.clock*20)%2?3:1;}
  else if(h.state==='dodge'){p.kind='roll';p.f=Math.floor(h.t*14)%2;}
  else if(h.state==='hurt'){p.a=-.4;p.lean=-1;p.bob=1;}

  else if(h.state==='win'){p.a=-1.57;p.bob=Math.sin(S.clock*6)>0?1:0;}
