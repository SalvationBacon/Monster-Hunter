function rollLoot(){
  if(S.trial)return trialLoot();
  const m=S.m,D=S.def,h=S.h,out=[],add=(id,n)=>{if(n<=0)return;const o=out.find(d=>d.id===id&&!d.rare);if(o)o.n+=n;else out.push({id,n});};let bugs=[],fresh=[];
  for(const [id,lo,hi] of D.loot.common)add(id,lo+((Math.random()*(hi-lo+1))|0));
  const fl=lv(h.g,'fortune'),luck=1+.33*fl, broke=PARTS.filter(k=>m.parts[k].broken), time=D.time-S.timeLeft;
  if(fl>=2)for(const d of out)d.n++;
  if(S.pal&&S.pal.role==='gatherer'){for(const d of out)d.n++;add(BIOME_ING[D.biome][0],Math.floor(2*S.pal.care));}
  let unlock='';
  if(D.small){SAVE.packs++;qEvent('small');const X=S.ex;for(const [k,n] of Object.entries(X.got))add(k,n);   // what the expedition foraged and caught
    bugs=[...new Set(X.caught)];fresh=bugs.filter(i=>!SAVE.bugs[CREATURES[i].id]);for(const i of X.caught)SAVE.bugs[CREATURES[i].id]=(SAVE.bugs[CREATURES[i].id]||0)+1;
    qEvent('gather');if(X.caught.length)qEvent('catch',null,X.caught.length);}
  else{
    for(const k of PARTS)add(D.loot.parts[k],m.parts[k].broken?1:(Math.random()<.1*luck?1:0));
    add('gem',Math.random()<.08*luck?1:0);
    const dry=SAVE.dry[D.id]||0, chance=(RARE.base+RARE.part*broke.length+RARE.pity*dry)*luck*h.luck;
    if(Math.random()<chance){out.push({id:D.mat.rare,n:1,rare:true});SAVE.dry[D.id]=0;}else SAVE.dry[D.id]=dry+1;
    if(D.rank===7)qEvent('apex');
    const first=!SAVE.wins[D.id]; SAVE.wins[D.id]=(SAVE.wins[D.id]||0)+1;
    if(first){const r=D.rank,nx=HUNTS.find(x=>MONSTERS[x].rank===r&&!SAVE.wins[x]&&unlocked(x)&&x!==D.id);unlock=D.id==='fern'?'RANK 1 IS OPEN':trialOpen(r)?'THE '+rankName(r)+' TRIAL IS OPEN':nx?MONSTERS[nx].name+' IS OPEN':'';}

  }

  for(const id of T.list){const D=MONSTERS[id];for(const [k,lo,hi] of D.loot.common)add(k,lo+((Math.random()*(hi-lo+1))|0));SAVE.wins[id]=(SAVE.wins[id]||0)+1;qEvent('hunt',id);}

const nowMs=()=>MH.fakeNow||Date.now();
function dayKey(){const d=new Date(nowMs());return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function weekKey(){return 'w'+Math.floor((nowMs()/864e5+3)/7);}
// Today's three dailies and this week's weekly, drawn from their pools by date
function ensureQuests(){
  const pick=(key,pool,n)=>{const idx=pool.map((_,i)=>i),out=[];let h=0;for(const ch of key)h=(Math.imul(h,31)+ch.charCodeAt(0))|0;
    for(let k=0;k<n;k++){h=Math.imul(h^(h>>>13),1274126177)|0;out.push(idx.splice(Math.abs(h)%idx.length,1)[0]);}return out.map(i=>({k:i,p:0,c:false}));};
  if(SAVE.daily.key!==dayKey())SAVE.daily={key:dayKey(),q:pick(dayKey(),DAILIES,3)};
  if(SAVE.weekly.key!==weekKey())SAVE.weekly={key:weekKey(),q:pick(weekKey(),WEEKLIES,1)};
}
// Every quest that can make progress right now: {kind, def, st}. st holds p (progress) and c (claimed).
function quests(){
  ensureQuests(); const out=[];
  if(SAVE.story.i<STORY.length){const def=STORY[SAVE.story.i],g=def.goal;if(g[0]==='rank')SAVE.story.p=rankOpen(g[1])?1:0;if(g[0]==='apex')SAVE.story.p=Math.max(SAVE.story.p,rankWins(7));if(g[0]==='done')SAVE.story.p=0;
    out.push({kind:'story',def,st:SAVE.story});}
  SAVE.daily.q.forEach(st=>out.push({kind:'daily',def:DAILIES[st.k],st}));
  SAVE.weekly.q.forEach(st=>out.push({kind:'weekly',def:WEEKLIES[st.k],st}));
  if(SAVE.wins.fern)for(const def of SIDES){const st=SAVE.side[def.id]=SAVE.side[def.id]||{p:0,c:false};out.push({kind:'side',def,st});}
  return out;
}
const qDone=q=>q.st.p>=q.def.goal[2], qClaimable=q=>qDone(q)&&!q.st.c;
function qEvent(type,arg,n){
  for(const q of quests()){const g=q.def.goal;if(q.st.c||g[0]!==type||(g[1]!=null&&g[1]!==arg))continue;q.st.p=Math.min(g[2],q.st.p+(n||1));}
}
function give(rw){for(const [k,n] of Object.entries(rw)){if(k==='potion')SAVE.potions+=n;else if(k==='pal')SAVE.pal=true;else SAVE.bag[k]=(SAVE.bag[k]||0)+n;}}

// ── Gather run: tap what pops up before it goes, and catch creatures in their closing circle ──
// A run: something pops up every 1.4 to 2.2s, so a perfect run gathers about ten things; one creature crosses once
function update(dt){
  S.t+=dt; if(S.toast&&(S.toast.t+=dt)>1.6)S.toast=null;
  if(S.talk){talkUpdate(dt);return;}                                             // a scene pauses everything
  guideTick();
  if(S.mode==='camp'||S.mode==='prep')storyTick();
  if(S.hint&&(S.hint.t+=dt)>3.5)S.hint=null;
  if(S.mode!=='hunt'||S.paused)return;
  huntTutor();if(S.talk)return;
  if(S.stop>0){S.stop-=dt;return;}                                               // hitstop
  if(S.slow>0){S.slow-=dt;dt*=.3;}
  S.clock+=dt;
  if(S.shake>0)S.shake-=dt*1.6;
  const h=S.h,m=S.m, over=h.state==='dead'||m.state==='dead';
  if(S.forage){if(S.forage.t>.3&&talk('v_gather'))return;forageUpdate(dt);}
  if(!over&&!S.forage){S.timeLeft-=dt;if(S.timeLeft<=0){S.timeLeft=0;h.state='dead';S.fail='TIME UP';S.endT=0;sfx('lose');}}
  hUpdate(dt); mUpdate(dt); qteUpdate(dt); palUpdate(dt);
  if(S.respawn>0&&(S.respawn-=dt)<=0){S.respawn=0;if(S.trial)trialNext();else{S.m=freshMonster(S.def,S.h.g.status);S.m.enter=.5;S.m.wait=1.2;if(S.def.alpha&&S.pack===1){S.m.hp=S.m.max=Math.round(S.m.max*2.2);S.def.dmg*=1.3;exBanner('AN ALPHA LEADS THE PACK!','#ffd34d');mv('roar');}}}
  for(const f of S.fx)f.t+=dt; S.fx=S.fx.filter(f=>f.t<(f.life||.22));
  for(const p of S.pt){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;} S.pt=S.pt.filter(p=>p.life>0);
  for(const n of S.nums){n.t+=dt;} S.nums=S.nums.filter(n=>n.t<n.life);
  if(h.state==='dead'||(m.state==='dead'&&!S.respawn&&!S.forage&&S.m===m)){
    S.endT+=dt;
    if(m.state==='dead'&&S.endT>1.9){S.loot=rollLoot();S.mode='loot';S.t=0;sfx('win');}
    else if(h.state==='dead'&&S.endT>1.5){S.mode='fail';S.t=0;save();}
  }
}

function draw(){
  syncSearch();
  g.imageSmoothingEnabled=false;
  if(S.mode==='title'){drawTitle();return;}
  if(S.mode==='camp'){drawCamp();return;}
  if(S.mode==='prep'){drawPrep();return;}
  drawWorld();drawHud();if(S.mode==='hunt'&&S.paused)drawPause();
  if(S.mode==='loot')drawLoot();else if(S.mode==='fail')drawFail();
}

// ── Sizing: fixed logical width, logical height follows the screen's shape ──
function resize(){
  const r=document.body.getBoundingClientRect(), vw=r.width||innerWidth, vh=r.height||innerHeight;   // the body, so safe-area padding is respected
  LH=clamp(Math.round(W*vh/vw),200,284);
  cv.width=W;cv.height=LH;
  const scale=Math.min(vw/W,vh/LH);cv.style.width=Math.floor(W*scale)+'px';cv.style.height=Math.floor(LH*scale)+'px';
  layout();BGS={};BG=bgFor(S.def?S.def.biome:0);
}
addEventListener('resize',resize);resize();
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.mode==='hunt'&&!S.paused)pauseHunt(true);if(AC&&AC.state==='running')AC.suspend();}else if(AC&&AC.state==='suspended')AC.resume();});

let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;                               // the first frame can arrive stamped before the page started
  requestAnimationFrame(frame);                                                  // schedule first, so one bad frame cannot stop the game
  try{if(!MH.manual)update(dt);draw();if(!MH.manual)abTick(S.mode==='hunt'?5:3);if(S.guide&&!S.talk&&(S.mode==='camp'||S.mode==='prep')&&!S.opts)drawGuide();if(S.hint&&!S.talk&&S.mode==='hunt'&&!S.paused)drawHint();if(S.talk)drawTalk();}catch(e){if(!MH.lastErr)console.error(e.message+' @ '+(e.stack||'').split('\n').slice(1,3).join(' '));MH.lastErr=e.message+' | mode='+S.mode;}
}
