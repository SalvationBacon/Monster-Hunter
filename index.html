//  PIXEL SPRITES
//  shapeSpr paints colour indices into a grid from simple shapes, then shades each
//  colour area (light from the top left) and outlines the silhouette. Cached by key.
//  A palette entry starting with '!' is drawn flat (eyes, glows).
// ═══════════════════════════════════════════════════
const OUTLINE='#141826';
let SPR={}, SPR_N=0;
function shapeSpr(key,w,h,pal,paint){
  if(SPR[key])return SPR[key];
  if(++SPR_N>600){SPR={};SPR_N=0;}
  const G=new Uint8Array(w*h); let ox=0,oy=0;
  const set=(x,y,c)=>{x=(x+ox)|0;y=(y+oy)|0;if(x>=0&&y>=0&&x<w&&y<h)G[y*w+x]=c;};
  const a={
    off(x,y){ox=x;oy=y;},
    ell(cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if((x*x)/(rx*rx+.5)+(y*y)/(ry*ry+.5)<=1)set(cx+x,cy+y,c);},
    rect(x,y,ww,hh,c){for(let j=0;j<hh;j++)for(let i=0;i<ww;i++)set(x+i,y+j,c);},
    poly(pts,c){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const[x,y]of pts){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y);}
      for(let y=Math.floor(y0);y<=y1;y++)for(let x=Math.floor(x0);x<=x1;x++){let ins=false;
        for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if(((yi>y+.5)!==(yj>y+.5))&&(x+.5<(xj-xi)*(y+.5-yi)/(yj-yi)+xi))ins=!ins;}
        if(ins)set(x,y,c);}},
    px:set
  };
  paint(a);
  const c=document.createElement('canvas');c.width=w;c.height=h;const q=c.getContext('2d');
  const at=(x,y)=>x<0||y<0||x>=w||y>=h?0:G[y*w+x];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const v=at(x,y);
    if(!v){if(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)){q.fillStyle=OUTLINE;q.fillRect(x,y,1,1);}continue;}
    const p=pal[v]; let col=p;
    if(p[0]==='!')col=p.slice(1);
    else if(at(x-1,y-1)!==v&&at(x,y-1)!==v)col=shade(p,.28);
    else if(at(x+1,y+1)!==v)col=shade(p,-.3);
    else if(at(x,y+2)!==v||at(x+2,y)!==v)col=shade(p,-.14);
    q.fillStyle=col;q.fillRect(x,y,1,1);
  }
  return SPR[key]=c;
}
// All-white copy of a sprite, for the hit flash
function whiteSpr(key,s){
  const k=key+'#w'; if(SPR[k])return SPR[k];
  const c=document.createElement('canvas');c.width=s.width;c.height=s.height;const q=c.getContext('2d');
  q.drawImage(s,0,0);q.globalCompositeOperation='source-in';q.fillStyle='#fff';q.fillRect(0,0,c.width,c.height);
  return SPR[k]=c;
}

const gw=ch=>{const d=FONT[ch];return d&&d.length===25?5:3;};

function glyphs(str,x,y,col,s){g.fillStyle=col;for(const ch of str){const d=FONT[ch],w=gw(ch);if(d)for(let i=0;i<d.length;i++)if(d[i]==='1')g.fillRect(x+(i%w)*s,y+((i/w)|0)*s,s,s);x+=(w+1)*s;}}
// align: 0 left, 1 centre, 2 right. out: outline colour or null
function text(str,x,y,col,o){
  o=o||{}; const s=o.s||1, w=textW(str)*s; x=Math.round(o.al===1?x-w/2:o.al===2?x-w:x); y=Math.round(y);
  if(o.out){glyphs(str,x-1,y,o.out,s);glyphs(str,x+1,y,o.out,s);glyphs(str,x,y-1,o.out,s);glyphs(str,x,y+1,o.out,s);}

function bar(x,y,w,h,f,col,back){g.fillStyle='#000';g.fillRect(x-1,y-1,w+2,h+2);g.fillStyle=back;g.fillRect(x,y,w,h);const fw=Math.round(w*clamp(f,0,1));if(fw>0){g.fillStyle=col;g.fillRect(x,y,fw,h);g.fillStyle=shade(col,.35);g.fillRect(x,y,fw,1);}}
function ring(cx,cy,r,col){g.fillStyle=col;const n=Math.max(12,Math.round(r*5));for(let i=0;i<n;i++){const a=i/n*Math.PI*2;g.fillRect(Math.round(cx+Math.cos(a)*r),Math.round(cy+Math.sin(a)*r*.55),1,1);}}

  const ar=armorCol(eq.armor),he=armorCol(eq.helm),ga=armorCol(eq.arms),bo=armorCol(eq.legs);

  return shapeSpr(key,HS_W,HS_H,pal,a=>{
    a.off(4,2);

      if(p.f){a.ell(14,31,7,6,2);a.ell(17,28,4,4,3);a.rect(8,34,5,2,6);}
      else{a.ell(14,31,7,6,2);a.ell(10,33,4,4,3);a.rect(15,26,5,2,6);}

    const b=p.bob, l=p.lean;
    a.rect(9,31,4,4,14); a.rect(15,31,4,4,14); a.rect(9,35,4,3,15); a.rect(15,35,4,3,15);   // legs and boots
    a.rect(8+l,18+b,12,14-b,2); a.rect(8+l,25+b,12,2,6);                         // armour, belt
    a.ell(14+l,13+b,5,5,1);                                                      // head
    a.poly([[8+l,11+b],[14+l,6+b],[20+l,11+b],[20+l,14+b],[9+l,14+b]],12);       // helmet

    a.rect(6+l,18+b,4,4,13); a.rect(18+l,18+b,4,4,13);                           // gauntlets' shoulder guards
    const hx=21+l,hy=24+b, c=Math.cos(aq/5), s=Math.sin(aq/5), col=p.glow?7+p.glow:5;
    const blade=(x,y,c,s,L,w)=>a.poly([[x-s*w,y+c*w],[x+s*w,y-c*w],[x+c*L+s*w,y+s*L-c*w],[x+c*(L+2),y+s*(L+2)],[x+c*L-s*w,y+s*L+c*w]],col);
    if(wt==='gs'){blade(hx,hy,c,s,17,1);a.rect(hx-1,hy-1,3,3,6);}
    else if(wt==='db'){const c2=Math.cos(aq/5+.9),s2=Math.sin(aq/5+.9);blade(hx-9,hy+1,c2,s2,9,.6);blade(hx,hy,c,s,10,.6);a.rect(hx-1,hy-1,2,2,6);}
    else if(wt==='hm'){a.poly([[hx-s*.6,hy+c*.6],[hx+s*.6,hy-c*.6],[hx+c*13+s*.6,hy+s*13-c*.6],[hx+c*13-s*.6,hy+s*13+c*.6]],6);
      a.poly([[hx+c*10-s*4,hy+s*10+c*4],[hx+c*10+s*4,hy+s*10-c*4],[hx+c*16+s*4,hy+s*16-c*4],[hx+c*16-s*4,hy+s*16+c*4]],col);}
    else{a.poly([[hx-s*1.2,hy+c*1.2],[hx+s*1.2,hy-c*1.2],[hx+c*23,hy+s*23]],col);a.rect(hx-1,hy-1,3,3,6);                       // lance and shield
      if(p.guard)a.poly([[18+l,15+b],[24+l,15+b],[25+l,27+b],[21+l,31+b],[17+l,27+b]],3);else a.rect(5+l,21+b,4,8,3);}

}

let AC=null, NOISE=null;
function audioInit(){
  if(AC||MH.manual)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();
    NOISE=AC.createBuffer(1,AC.sampleRate*.4,AC.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}
  musicStart();
}
function tone(f0,f1,dur,vol,type,delay){
  if(!AC)return; const t=AC.currentTime+(delay||0),o=AC.createOscillator(),v=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+dur);
}
function noise(dur,vol,freq){
  if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(),v=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=NOISE;f.type='lowpass';f.frequency.value=freq||2000;v.gain.setValueAtTime(vol,t);v.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f);f.connect(v);v.connect(AC.destination);s.start(t);s.stop(t+dur);
}

  hurt(){tone(200,60,.25,.25,'sawtooth');noise(.15,.25,900);}, warn(){tone(990,990,.06,.08);}, roar(){tone(120,50,.9,.3,'sawtooth');noise(.9,.3,700);},

// ═══════════════════════════════════════════════════
//  MUSIC: the same approach as 8-Bit Industry. Each track is a recipe (tempo, key, scale, chords, instruments,
//  drums); compileSong() turns it into notes as it plays. The melody hook comes from the track's own seed, so it
//  is the same every time; the accompaniment is reseeded each loop. A look-ahead scheduler (mTick, every 100ms)
//  plays the notes, and the music crossfades when the screen changes (musicCtx).
//  Every monster has its own track, built from what it is: its element picks the key and scale, its rank the
//  tempo, its body the lead voice and its trait the drums. Hunt tracks loop with no gap.
// ═══════════════════════════════════════════════════
const MSCALE={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],dorian:[0,2,3,5,7,9,10],mixo:[0,2,4,5,7,9,10],phryg:[0,1,3,5,7,8,10],lydian:[0,2,4,6,7,9,11],harm:[0,2,3,5,7,8,11]};

  [[0,8,4],[8,8,2]],[[0,2,0],[2,2,1],[4,2,2],[6,2,4],[8,8,2]],[[0,4,4],[6,2,2],[8,4,0],[12,4,2]],[[0,3,4],[3,3,4],[6,2,2],[8,4,0],[12,4,1]]];

const MFORMS={song:['intro',4,'A',8,'B',8,'A',8,'C',8,'B',8,'A',8,'outro',4],ambient:['intro',4,'A',8,'B',8,'C',8,'A',8,'outro',4],
  hunt:['intro',2,'A',8,'B',8,'A',8,'C',4,'B',8]};
const MROLES={intro:{lead:0,bass:'long',drums:'intro',arp:1},A:{lead:'mid',bass:'track',drums:'track',arp:0},B:{lead:'high',bass:'track',drums:'track',arp:1},
  C:{lead:'slow',bass:'pulse',drums:'half',arp:1},outro:{lead:'mid',bass:'long',drums:'intro',arp:0}};

const ELEM_KEY={nature:['dorian',57],earth:['mixo',55],fire:['phryg',52],ice:['lydian',62],thunder:['minor',57],water:['dorian',60],dragon:['harm',50]};
const RIG_LEAD={wyvern:'square',brute:'saw',serpent:'pulse25',raptor:'pulse12',crab:'square'};
const TRAIT_DRUMS={armor:'four',charge:'break',shell:'half',burrow:'back',regen:'back',frenzy:'gallop'};
function mRng(seed){let s=(seed>>>0)||1;return()=>{s^=s<<13;s>>>=0;s^=s>>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function mHash(str){let h=2166136261;for(let i=0;i<str.length;i++)h=Math.imul(h^str.charCodeAt(i),16777619);return h>>>0;}
// A monster's own track, from what it is
function monsterTrack(D){
  if(MTRACKS[D.id])return MTRACKS[D.id];
  const h=mHash(D.id),[scale,root]=ELEM_KEY[D.elem],r=mRng(h);
  return MTRACKS[D.id]={name:D.name,bpm:Math.min(144,104+D.rank*5+(D.trait==='frenzy'?6:0)+(h%5)),root:root+((h>>>3)%5)-2,scale,prog:PROGS[(h>>>7)%PROGS.length],form:'hunt',
    lead:RIG_LEAD[D.rig],arp:D.elem==='ice'||D.elem==='water'?'bell':'pulse12',bass:D.rank>=4||D.rig==='brute'?'saw':'tri',drums:TRAIT_DRUMS[D.trait]||(D.rank>=4?'four':'back'),
    bassPat:['octave','root8','synco','pulse','walk'][(h>>>11)%5],rhy:[0,1,2,3].map(()=>(r()*MMOT.length)|0),pad:D.rank>=6?1:0,swing:D.elem==='nature'?.15:0,fx:.12+((h>>>15)%3)*.06,loop:1};
}
function compileSong(tr,n){
  const sc=MSCALE[tr.scale], st=60/tr.bpm/4, bar=st*16, ev=[], form=MFORMS[tr.form];
  const freq=deg=>{const o=Math.floor(deg/7), k=((deg%7)+7)%7; return 440*Math.pow(2,(tr.root+12*o+sc[k]-69)/12);};
  let t=0;
  const add=(s,len,deg,i,v,x)=>{const sw=s%4===2?(tr.swing||0)*st:0; ev.push(Object.assign({t:t+s*st+sw,f:deg===null?0:freq(deg),d:len*st,v:v*(tr.vol||1),i},x||{}));};
  const lp=i=>i==='saw'?{lp:1800}:null, occ={};
  for(let k=0;k<form.length;k+=2){
    const sec=form[k], bars=form[k+1], role=MROLES[sec]; occ[sec]=(occ[sec]||0)+1;

function hunterX(){const h=S.h;
  if(h.state==='dodge')return Math.round(h.dir*16*Math.sin(Math.PI*h.t/DODGE_DUR));
  if(h.state==='hurt')return -Math.round(7*Math.sin(Math.PI*Math.min(1,h.t/.45)));
  if(h.state==='atk')return h.combo===2?3:1;
  if(h.state==='heavy')return 4;
  if(h.state==='counter')return Math.round(26*Math.sin(Math.PI*clamp(h.t/.5,0,1)));
  return 0;
}

// ── Weak points ──

    return;}

}

function hUpdate(dt){
  const h=S.h, W=h.g.W, P=h.g.perks, held=IN.down&&!IN.swiped; h.t+=dt;
  if(h.inv>0)h.inv-=dt; if(h.buff>0)h.buff-=dt; if(h.bl>0)h.bl-=dt; if(h.counter>0)h.counter-=dt; if(h.comboT>0)h.comboT-=dt; if(h.buf>0)h.buf-=dt;

      if(h.hp>1){const t=Math.min(d,h.hp-1);h.hp-=t;S.stats.taken+=t;S.stats.dot=(S.stats.dot||0)+t;addNum(L.hx+10+rnd(0,16),L.hFeet-30,''+t,h.burn>0?'#ff9a2e':bleeding?'#e2483d':'#7ad84a',.6);}}

      if(dl){h.state='dance';h.t=0;h.lvl=dl;h.dn=0;h.fury=0;h.target=IN.part;S.stats.dances=(S.stats.dances||0)+1;sfx('charge',dl);buzz(20);}else addNum(L.hx+18,L.hFeet-40,'NEED FURY','#8a93b0',.6);}}

function actTap(part){const h=S.h;

  if(h.state==='frozen'){h.frozen-=FREEZE.tap;S.shake=Math.max(S.shake,.1);sfx('hit');S.pt.push({x:L.hx+18+rnd(-8,8),y:L.hFeet-rnd(4,30),vx:rnd(-50,50),vy:rnd(-60,-10),life:.3,col:'#bfeaff',g:200});return;}   // struggle free

function actCounter(){const h=S.h;
  if(h.counter<=0||h.state==='frozen'||h.state==='numb'||h.state==='hurt'||h.state==='dead'||h.state==='win')return false;

  if(h.mud>0){h.mud=0;addNum(L.hx+18,L.hFeet-40,'SHAKEN OFF','#c8d0e8',.8);}

function actSharpen(){const h=S.h;if(h.state==='numb'||h.state==='frozen')return;

function press(x,y){
  audioInit(); if(AC&&AC.state==='suspended')AC.resume();

  if(S.mode==='title'){if(S.howto){S.howto=false;return;}if(!tapBtns(x,y)&&!S.opts)toCamp(SAVE.wins.fern?'hunt':'quest');return;}
  if(S.mode==='hunt'&&S.paused){tapBtns(x,y);return;}
  if(S.mode==='hunt'&&x>=W-16&&y<=13&&S.h.state!=='dead'&&S.h.state!=='win'){pauseHunt(true);return;}      // the pause button
  if(S.mode==='loot'||S.mode==='fail'||S.mode==='gres'){if(S.t>1.2)toCamp(qClaimable(quests()[0]||{st:{p:0,c:true},def:{goal:[0,0,1]}})?'quest':'hunt');return;}
  if(S.mode==='camp'||S.mode==='prep'){const b=S.btns.find(b=>x>=b.x&&x<b.x+b.w&&y>=b.y&&y<b.y+b.h);if(!guideGate(b,x,y))return;if(b)b.fn();return;}
  if(S.mode==='gather'){gatherTap(x,y);return;}
  if(S.mode!=='hunt')return;
  const b=L.potion; if(x>=b.x-1&&x<=b.x+b.w+2&&y>=b.y-2){actPotion();return;}
  const sb=L.sharp; if(x>=sb.x-2&&x<b.x-1&&y>=sb.y-2){actSharpen();return;}
  const c=L.counter; if(S.h.counter>0&&x>=c.x-10&&x<=c.x+c.w+10&&y>=c.y-8&&y<=c.y+c.h+8&&actCounter())return;
  if(qteTap(x,y))return;
  IN.down=true;IN.downAt=S.clock;IN.x0=x;IN.y0=y;IN.swiped=false;IN.part=partAt(x,y);
  actTap(IN.part);return true;
}
function move(x,y){
  if(!IN.down||IN.swiped||S.mode!=='hunt')return;
  const dx=x-IN.x0,dy=y-IN.y0;
  if(Math.abs(dx)<9&&Math.abs(dy)<9)return;
  IN.swiped=true;IN.down=false;
  if(-dy>Math.abs(dx)*1.2)actPotion();else if(dy>Math.abs(dx)*1.2)actSharpen();else actDodge(dx<0?-1:1);

function release(){if(!IN.down)return;IN.down=false;if(S.mode==='hunt')hRelease();}
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}const p=toLogical(e);
  if(S.mode==='camp'||S.mode==='prep'){IN.ui={x:p.x,y:p.y,s:scrollGet(),moved:false,t0:performance.now()};IN.id=e.pointerId;return;}                // lists scroll, so a tap fires on release
  if(press(p.x,p.y))IN.id=e.pointerId;});   // a weak-point tap with a second finger leaves a held charge alone

// Keyboard: J or Space attack the head (hold to charge), K the tail, A/D or arrows dodge, W or Q potion

  if(k===' '||k==='j'||k==='k'||k==='enter'){e.preventDefault();audioInit();

function rollLoot(){
  const m=S.m,D=S.def,h=S.h,out=[],add=(id,n)=>{if(n>0)out.push({id,n});};
  for(const [id,lo,hi] of D.loot.common)add(id,lo+((Math.random()*(hi-lo+1))|0));
  const fl=lv(h.g,'fortune'),luck=1+.33*fl, broke=PARTS.filter(k=>m.parts[k].broken), time=D.time-S.timeLeft;
  if(fl>=2)for(const d of out)d.n++;
  if(S.pal&&S.pal.role==='gatherer'){for(const d of out)d.n++;add(BIOME_ING[D.biome][0],Math.floor(2*S.pal.care));}
  let unlock='';
  if(D.small){SAVE.packs++;qEvent('small');}
  else{
    for(const k of PARTS)add(D.loot.parts[k],m.parts[k].broken?1:(Math.random()<.1*luck?1:0));
    add('gem',Math.random()<.08*luck?1:0);
    const dry=SAVE.dry[D.id]||0, chance=(RARE.base+RARE.part*broke.length+RARE.pity*dry)*luck*h.luck;
    if(Math.random()<chance){out.push({id:D.mat.rare,n:1,rare:true});SAVE.dry[D.id]=0;}else SAVE.dry[D.id]=dry+1;
    if(D.rank===7)qEvent('apex');
    const first=!SAVE.wins[D.id]; SAVE.wins[D.id]=(SAVE.wins[D.id]||0)+1;
    if(first){const r=D.rank;unlock=D.id==='fern'?'RANK 1 IS OPEN':r<RANKS&&rankOpen(r+1)&&(r===7?rankWins(7)===4:rankWins(r)===RANK_NEED)?rankName(r+1)+' IS OPEN':'';}
    qEvent('hunt',D.id);qEvent('weapon',h.g.wt);if(time<45)qEvent('fast');
    if(broke.length){qEvent('break',null,broke.length);if(m.parts.tail.broken)qEvent('tail');if(broke.length===3)qEvent('allbreak');}
  }
  if(S.stats.perfect)qEvent('perfect',null,S.stats.perfect);
  if(S.pal)qEvent('pal');
  for(const d of out)SAVE.bag[d.id]=(SAVE.bag[d.id]||0)+d.n;
  save();
  return{drops:out,bag:SAVE.bag,time,unlock};
}

// ── Quests ──
const nowMs=()=>MH.fakeNow||Date.now();
function dayKey(){const d=new Date(nowMs());return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function weekKey(){return 'w'+Math.floor((nowMs()/864e5+3)/7);}
// Today's three dailies and this week's weekly, drawn from their pools by date
function ensureQuests(){
  const pick=(key,pool,n)=>{const idx=pool.map((_,i)=>i),out=[];let h=0;for(const ch of key)h=(Math.imul(h,31)+ch.charCodeAt(0))|0;
    for(let k=0;k<n;k++){h=Math.imul(h^(h>>>13),1274126177)|0;out.push(idx.splice(Math.abs(h)%idx.length,1)[0]);}return out.map(i=>({k:i,p:0,c:false}));};
  if(SAVE.daily.key!==dayKey())SAVE.daily={key:dayKey(),q:pick(dayKey(),DAILIES,3)};
  if(SAVE.weekly.key!==weekKey())SAVE.weekly={key:weekKey(),q:pick(weekKey(),WEEKLIES,1)};
}
// Every quest that can make progress right now: {kind, def, st}. st holds p (progress) and c (claimed).
function quests(){
  ensureQuests(); const out=[];
  if(SAVE.story.i<STORY.length){const def=STORY[SAVE.story.i],g=def.goal;if(g[0]==='rank')SAVE.story.p=rankOpen(g[1])?1:0;if(g[0]==='apex')SAVE.story.p=Math.max(SAVE.story.p,rankWins(7));if(g[0]==='done')SAVE.story.p=0;
    out.push({kind:'story',def,st:SAVE.story});}
  SAVE.daily.q.forEach(st=>out.push({kind:'daily',def:DAILIES[st.k],st}));
  SAVE.weekly.q.forEach(st=>out.push({kind:'weekly',def:WEEKLIES[st.k],st}));
  if(SAVE.wins.fern)for(const def of SIDES){const st=SAVE.side[def.id]=SAVE.side[def.id]||{p:0,c:false};out.push({kind:'side',def,st});}
  return out;
}
const qDone=q=>q.st.p>=q.def.goal[2], qClaimable=q=>qDone(q)&&!q.st.c;
function qEvent(type,arg,n){
  for(const q of quests()){const g=q.def.goal;if(q.st.c||g[0]!==type||(g[1]!=null&&g[1]!==arg))continue;q.st.p=Math.min(g[2],q.st.p+(n||1));}
}
function give(rw){for(const [k,n] of Object.entries(rw)){if(k==='potion')SAVE.potions+=n;else if(k==='pal')SAVE.pal=true;else SAVE.bag[k]=(SAVE.bag[k]||0)+n;}}
function rewardText(rw){return Object.entries(rw).map(([k,n])=>k==='pal'?'PIP JOINS YOU':n+' '+LOOT[k].name).join(', ');}
function claim(q){
  if(!qClaimable(q))return; give(q.def.rw);
  if(q.kind==='story'){SAVE.story.i++;SAVE.story.p=0;}else q.st.c=true;
  toast(rewardText(q.def.rw)||'DONE','#ffe14d');sfx('win');buzz(60);save();

  if((G.spawn-=dt)<=0){G.spawn=rnd(GATHER.spawn[0],GATHER.spawn[1]);const rare=Math.random()<GATHER.rare;
    G.nodes.push({x:rnd(12,W-12),y:rnd(L.ground+4,LH-26),id:BIOME_ING[G.bi][rare?1:0],rare,t:0,life:rare?GATHER.rareLife:GATHER.life});}

    G.bug={i,dir,x:dir>0?-8:W+8,y:rnd(40,L.ground+30),t:0};}

function gatherTap(x,y){

  let best=null,bd=GATHER.r*GATHER.r;for(const n of G.nodes){const d=(x-n.x)**2+(y-n.y)**2;if(d<=bd){bd=d;best=n;}}

function update(dt){
  S.t+=dt; if(S.toast&&(S.toast.t+=dt)>1.6)S.toast=null;
  if(S.talk){talkUpdate(dt);return;}                                             // a scene pauses everything
  guideTick();holdCheck();
  if(S.mode==='camp'||S.mode==='prep')storyTick();
  if(S.mode==='gather'){if(S.t>.4&&talk('v_gather'))return;gatherUpdate(dt);return;}
  if(S.hint&&(S.hint.t+=dt)>3.5)S.hint=null;

  huntTutor();if(S.talk)return;
  if(S.stop>0){S.stop-=dt;return;}                                               // hitstop
  if(S.slow>0){S.slow-=dt;dt*=.3;}
  S.clock+=dt;
  if(S.shake>0)S.shake-=dt*1.6;
  const h=S.h,m=S.m, over=h.state==='dead'||m.state==='dead';
  if(!over){S.timeLeft-=dt;if(S.timeLeft<=0){S.timeLeft=0;h.state='dead';S.fail='TIME UP';S.endT=0;sfx('lose');}}
  hUpdate(dt); mUpdate(dt); qteUpdate(dt); palUpdate(dt);

  for(const f of S.fx)f.t+=dt; S.fx=S.fx.filter(f=>f.t<(f.life||.22));
  for(const p of S.pt){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;} S.pt=S.pt.filter(p=>p.life>0);
  for(const n of S.nums){n.t+=dt;} S.nums=S.nums.filter(n=>n.t<n.life);
  if(h.state==='dead'||(m.state==='dead'&&!S.respawn&&S.m===m)){
    S.endT+=dt;
    if(m.state==='dead'&&S.endT>1.9){S.loot=rollLoot();S.mode='loot';S.t=0;sfx('win');}
    else if(h.state==='dead'&&S.endT>1.5){S.mode='fail';S.t=0;save();}

}

function drawLoot(){

  const ph=58+R.drops.length*14+(R.unlock?10:0), y=Math.max(18,((LH-ph)/2)|0);panel(8,y,W-16,ph);

  R.drops.forEach((d,i)=>{const at=.5+i*.35;if(S.t<at)return;if(!d.snd){d.snd=1;sfx('loot');}

// One piece of gear's line of numbers: attack and element, health and resistance, a perk, or Pip's stats
function gearLine(id,x,y,alt,B,top,bot){
  const G=GEAR[id],lv=lvOf(id),tap=(bid,w,fn)=>{if(B&&y-2>=(top||0)&&y+7<=(bot||LH))B.push({id:bid,x:x-1,y:y-2,w:w+2,h:9,fn});},tag=(t,c)=>{text(t,x,y,c);x+=textW(t)+4;};
  const wk=G.elem?ELEM[G.elem]:G.status?[STATUS[G.status].name,STATUS[G.status].col]:null;
  if(G.slot==='pweapon'){tag('PIP ATK *'+G.patk.toFixed(2),'#7fe0c0');if(wk)tag(wk[0],wk[1]);}
  else if(G.slot==='parmor')tag('PIP CARE *'+G.care.toFixed(2),'#7fe0c0');
  else if(G.slot==='weapon'){tag('ATK *'+gearAtk(id).toFixed(2),'#4cd964');if(wk)tag(wk[0],wk[1]);}
  else if(isArmor(G.slot)){tag('HP '+gearHp(id),'#4cd964');const D=MONSTERS[G.tier],el=D&&D.elem,ph=Math.floor(S.t/2.5)%3;
    if(D&&ph===1){tag('RESISTS','#4cd964');tag(ELEM[el][0],ELEM[el][1]);}else if(D&&ph===2){tap('setb:'+id,textW('SET: '+SETB[D.setb].name),()=>{S.skill={set:D.setb,tier:G.tier};sfx('charge',1);});tag('SET: '+SETB[D.setb].name,'#ff9a4d');}else skillTags(G);}   // takes turns: skills, resistance, set bonus
  else skillTags(G);
  function skillTags(G){for(const [k,n] of Object.entries(G.sk||{})){const t=PERKS[k].tag+'+'+n;tap('skill:'+k+':'+id,textW(t),()=>{S.skill={k};sfx('charge',1);});text(t,x,y,'#ffe14d');x+=textW(t)+3;}}
}
// One line of cost icons with have/need, from x. Returns where it ended.
function costRow(cost,x,y,gap,B,top,bot){for(const [k,n] of Object.entries(cost)){const have=Math.min(99,k==='potion'?SAVE.potions:SAVE.bag[k]||0),t=have+'/'+n;g.drawImage(lootSpr(k),0,0,12,12,x,y-2,9,9);text(t,x+10,y,have>=n?'#4cd964':'#ff6a4d');
  const w=10+textW(t),bw=Math.min(w+2,W-36-x);if(B&&bw>6&&y-3>=(top||0)&&y+8<=(bot||LH))B.push({id:'mat:'+k,x:x-1,y:y-3,w:bw,h:11,fn:()=>{S.mat=k;sfx('charge',1);}});      // tap a material to see where it comes from
  x+=w+(gap||4);}return x;}
function rewardRow(rw,x,y){for(const [k,n] of Object.entries(rw)){if(k==='pal'){if(SAVE.pal)g.drawImage(palSpr(0),0,0,16,14,x,y-3,11,10);else text('???',x,y,'#ffe14d');x+=14;continue;}g.drawImage(lootSpr(k),0,0,12,12,x,y-2,9,9);const t='*'+n;text(t,x+10,y,'#ffe14d');x+=10+textW(t)+4;}return x;}
function smallBtn(B,id,x,y,w,lab,col,fn,on){g.fillStyle='#000';g.fillRect(x,y,w,11);g.fillStyle=col;g.fillRect(x+1,y+1,w-2,9);text(lab,x+w/2,y+3,on===false?'#8a93b0':'#fff',{al:1});B.push({id,x:x-2,y:y-2,w:w+4,h:15,fn});}

const KNOW_AT=[0,1,3,5,10];          // hunts to learn more about a monster: basics, notes, attacks, drops, mastery
const know=id=>!unlocked(id)?-1:KNOW_AT.reduce((a,n,i)=>(SAVE.wins[id]||0)>=n?i:a,0);
const partWord=(D,k)=>D.matName[k].slice(D.short.length+1);
const GEM_CH=.08, PART_CH=.1;
function matSources(id){
  const L=[],t=(txt,col,ind,fn)=>L.push({txt,col:col||'#c8d0e8',ind:ind||0,fn});
  if(id==='potion'){t('BREW THEM IN THE KITCHEN');return L;}
  if(id==='gem'){t('ANY BIG MONSTER: '+GEM_CH*100+'%','#ffe14d');t('THE FORTUNE SKILL HELPS');t('SOME QUESTS GIVE GEMS');return L;}
  if(id==='meat'){t('PACK HUNTS: 2-3 EACH','#ffe14d');t('OPEN EXPEDITIONS, THEN PACK HUNT',null,1);return L;}
  const bi=BIOME_ING.findIndex(p=>p.includes(id));
  if(bi>=0){const scarce=BIOME_ING[bi][1]===id;t('GATHER RUNS: '+BIOME_NAME[bi],'#ffe14d');t(scarce?'THE SCARCER ONE THERE':'COMMON THERE',null,1);t('EXPEDITIONS > GATHER',null,1);if(!scarce&&SAVE.pal)t('PIP AS GATHERER BRINGS SOME');return L;}
  for(const mid of HUNTS){const D=MONSTERS[mid],k=Object.keys(D.mat).find(k=>D.mat[k]===id);if(!k)continue;
    const kn=unlocked(mid),go=kn?()=>{S.mat=null;S.menu=false;S.tab='book';S.bpick=mid;S.scr.bdet=0;sfx('charge',1);}:null;
    t(kn?D.name+(go?' >':''):'AN UNKNOWN RANK '+D.rank+' MONSTER',kn?'#ffe14d':'#8a93b0',0,go);
    if(k==='scale')t('CARVED: 2-4 EVERY HUNT',null,1);else if(k==='claw')t('CARVED: 1-2 EVERY HUNT',null,1);
    else if(k==='rare'){t('RARE: '+RARE.base*100+'% +'+RARE.part*100+'% PER BREAK',null,1);t('LIKELIER AFTER EACH MISS',null,1);}
    else{t('BREAK ITS '+partWord(D,k)+': ALWAYS',null,1);t('NO BREAK: '+PART_CH*100+'% CHANCE',null,1);}
    if(EXPED.includes(mid)&&(k==='scale'||k==='claw'))t('PACK HUNTS: '+(k==='scale'?'1-2':'1')+' EACH',null,1);}
  if(!L.length)t('NO KNOWN SOURCE');
  return L;}

// wrap text to a width, by words
function wrapText(t,w){const out=[];let line='';for(const word of t.split(' ')){const tr=line?line+' '+word:word;if(textW(tr)>w&&line){out.push(line);line=word;}else line=tr;}if(line)out.push(line);return out;}
// start a scene. Returns true if it started. force: replay even if seen.
function talk(key,force,after){
  if(S.talk||!SCENES[key])return false;if(!force&&(SAVE.seen[key]||MH.noTalk))return false;
  SAVE.seen[key]=1;save();if(!after&&/^h_/.test(key))after=()=>{S.hint={k:key,t:0};};talkLines(SCENES[key],after);return true;}
function talkLines(lines,after){S.talk={lines,i:0,ch:0,blip:0,after};IN.down=false;S.btns=[];}
function talkTap(x,y){const T=S.talk,full=T.lines[T.i][1].length;
  if(x>=W-30&&y>=T.by-11&&y<=T.by){S.talk=null;sfx('charge',1);if(T.after)T.after();return;}         // SKIP
  if(T.ch<full){T.ch=full;return;}
  if(++T.i>=T.lines.length){S.talk=null;sfx('charge',2);if(T.after)T.after();return;}
  T.ch=0;sfx('charge',1);}

function guide(key){if(S.guide||S.talk||MH.noTalk||SAVE.seen[key]||!GUIDES[key])return false;SAVE.seen[key]=1;save();S.guide={key,i:0,hit:false};return true;}

function guideTick(){if(!S.guide)return;const G=S.guide,L=GUIDES[G.key];
  while(G.i<L.length){const st=L[G.i];if(st.tap?G.hit:st.done&&st.done()){G.i++;G.hit=false;}else break;}
  if(G.i>=L.length||S.mode==='title')S.guide=null;}
// a camp/prep tap while a guide runs: only its target goes through (unless the step is free)
function guideGate(b,x,y){const G=S.guide;if(!G||S.talk)return true;
  if(G.skip&&x>=G.skip.x&&x<G.skip.x+G.skip.w&&y>=G.skip.y&&y<G.skip.y+G.skip.h){S.guide=null;sfx('charge',1);return false;}
  const st=gStep(),tg=gTarget();if(!st||!tg)return true;if(b===tg){G.hit=true;return true;}return !!st.free;}
function arrowAt(x,y,dir,col){                                                  // (x,y) is the tip; a head and a short stem
  const R=(dx,dy,w,h,o)=>g.fillRect(x+dx-o,y+dy-o,w+2*o,h+2*o);
  for(const [o,c] of [[1,OUTLINE],[0,col]]){g.fillStyle=c;for(let i=0;i<5;i++){
    if(dir==='down')R(-i,-i,2*i+1,1,o);else if(dir==='up')R(-i,i,2*i+1,1,o);else if(dir==='left')R(i,-i,1,2*i+1,o);else R(-i,-i,1,2*i+1,o);}
    if(dir==='down')R(-1,-9,3,5,o);else if(dir==='up')R(-1,5,3,5,o);else if(dir==='left')R(5,-1,5,3,o);else R(-9,-1,5,3,o);}}

function storyTick(){
  if(S.talk||S.opts||S.t<.3)return;
  if(S.mode==='camp'){
    if(!S.guide&&!S.menu&&!S.mat){
      if(SAVE.wins.fern&&talk('fern_win'))return;

function resize(){
  const r=document.body.getBoundingClientRect(), vw=r.width||innerWidth, vh=r.height||innerHeight;   // the body, so safe-area padding is respected
  LH=clamp(Math.round(W*vh/vw),200,284);
  cv.width=W;cv.height=LH;
  const scale=Math.min(vw/W,vh/LH);cv.style.width=Math.floor(W*scale)+'px';cv.style.height=Math.floor(LH*scale)+'px';
  layout();BGS={};BG=bgFor(S.def?S.def.biome:0);
}

let last=performance.now();
function frame(now){
  const dt=clamp((now-last)/1000,0,.05);last=now;                               // the first frame can arrive stamped before the page started

  try{if(!MH.manual)update(dt);draw();if(S.guide&&!S.talk&&(S.mode==='camp'||S.mode==='prep')&&!S.opts)drawGuide();if(S.hint&&!S.talk&&S.mode==='hunt'&&!S.paused)drawHint();if(S.talk)drawTalk();}catch(e){if(!MH.lastErr)console.error(e.message+' @ '+(e.stack||'').split('\n').slice(1,3).join(' '));MH.lastErr=e.message+' | mode='+S.mode;}
}
